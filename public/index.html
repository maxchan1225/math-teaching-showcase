<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>數學教學軟件及電子教材展示</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --paper: #ffffff;
      --ink: #172033;
      --muted: #647084;
      --line: #d8e0ec;
      --primary: #0f766e;
      --primary-dark: #0b5f59;
      --accent: #7c3aed;
      --warm: #b45309;
      --danger: #b42318;
      --success: #067647;
      --shadow: 0 18px 42px rgba(23, 32, 51, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(15, 118, 110, 0.08), transparent 320px),
        var(--bg);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      padding: 10px 15px;
      background: var(--primary);
      color: #ffffff;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover {
      background: var(--primary-dark);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.62;
    }

    .app-header {
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-inner,
    .workspace {
      width: min(1220px, 100%);
      margin: 0 auto;
      padding-inline: clamp(16px, 4vw, 34px);
    }

    .header-inner {
      min-height: 86px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--primary);
      font-size: 13px;
      font-weight: 900;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 4vw, 42px);
      line-height: 1.12;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 8px 12px;
      border: 1px solid #b7e4da;
      border-radius: 8px;
      color: var(--primary-dark);
      background: #ecfdf7;
      font-weight: 900;
      white-space: nowrap;
    }

    .live-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 5px rgba(6, 118, 71, 0.12);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(300px, 380px) minmax(0, 1fr);
      gap: clamp(18px, 3vw, 28px);
      padding-block: clamp(20px, 4vw, 38px) 46px;
      align-items: start;
    }

    .panel,
    .material {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .panel {
      padding: 20px;
      display: grid;
      gap: 16px;
      position: sticky;
      top: 112px;
    }

    form {
      display: grid;
      gap: 14px;
    }

    .panel h2,
    .gallery-head h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.22;
      letter-spacing: 0;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    label {
      font-size: 14px;
      font-weight: 900;
    }

    input,
    textarea,
    select {
      width: 100%;
      min-height: 46px;
      border: 1px solid #b9c5d6;
      border-radius: 8px;
      padding: 11px 12px;
      background: #ffffff;
      color: var(--ink);
    }

    textarea {
      min-height: 92px;
      resize: vertical;
      line-height: 1.55;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: 3px solid rgba(15, 118, 110, 0.18);
      border-color: var(--primary);
    }

    input[type="file"] {
      min-height: auto;
      padding: 10px;
      cursor: pointer;
    }

    .drop-zone {
      display: grid;
      gap: 8px;
      padding: 14px;
      border: 1px dashed #9fb2ca;
      border-radius: 8px;
      background: #f8fafc;
    }

    .file-hint {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      font-weight: 700;
    }

    .status {
      min-height: 22px;
      color: var(--muted);
      font-weight: 800;
      line-height: 1.5;
    }

    .status.error {
      color: var(--danger);
    }

    .status.success {
      color: var(--success);
    }

    .gallery {
      min-width: 0;
      display: grid;
      gap: 16px;
    }

    .gallery-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
    }

    .counter {
      padding: 8px 11px;
      border-radius: 8px;
      background: #eef2ff;
      color: #4338ca;
      font-weight: 900;
      white-space: nowrap;
    }

    .materials {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .material {
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 330px;
    }

    .preview {
      min-height: 210px;
      background: #e9eef6;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
    }

    .preview img,
    .preview iframe {
      width: 100%;
      height: 100%;
      min-height: 210px;
      border: 0;
      display: block;
      object-fit: cover;
      background: #ffffff;
    }

    .preview.text {
      place-items: stretch;
      padding: 16px;
      background: #fffaf0;
    }

    .text-preview {
      margin: 0;
      color: #5f370e;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow: auto;
      font-size: 14px;
    }

    .file-icon {
      width: 88px;
      height: 108px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #ffffff;
      border: 1px solid #c9d3e3;
      color: var(--accent);
      font-size: 28px;
      font-weight: 950;
      box-shadow: 0 12px 28px rgba(23, 32, 51, 0.12);
    }

    .material-body {
      padding: 15px;
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .material h3 {
      margin: 0;
      font-size: 19px;
      line-height: 1.28;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 5px 8px;
      border-radius: 8px;
      background: #f1f5f9;
      color: #344054;
      font-size: 13px;
      font-weight: 850;
    }

    .author {
      background: #ecfdf7;
      color: var(--primary-dark);
    }

    .description {
      margin: 0;
      color: var(--muted);
      line-height: 1.62;
      overflow-wrap: anywhere;
    }

    .open-link {
      width: max-content;
      color: var(--primary-dark);
      font-weight: 900;
      text-decoration: none;
      border-bottom: 2px solid rgba(15, 118, 110, 0.35);
    }

    .empty {
      min-height: 360px;
      border: 1px dashed #aab8cb;
      border-radius: 8px;
      display: grid;
      place-items: center;
      padding: 28px;
      color: var(--muted);
      text-align: center;
      font-size: 20px;
      font-weight: 900;
      background: rgba(255, 255, 255, 0.58);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 940px) {
      .header-inner,
      .gallery-head {
        grid-template-columns: 1fr;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .panel {
        position: static;
      }
    }

    @media (max-width: 680px) {
      .materials {
        grid-template-columns: 1fr;
      }

      .header-inner {
        min-height: 76px;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div>
        <p class="eyebrow">Firebase 即時教材展示</p>
        <h1>數學教學軟件及電子教材示例</h1>
      </div>
      <div class="live-badge" aria-live="polite">
        <span class="live-dot" aria-hidden="true"></span>
        <span id="liveText">等待同步</span>
      </div>
    </div>
  </header>

  <main class="workspace">
    <section class="panel" aria-labelledby="uploadTitle">
      <h2 id="uploadTitle">上傳教材</h2>
      <form id="uploadForm">
        <div class="field">
          <label for="authorInput">作者姓名</label>
          <input id="authorInput" name="author" type="text" maxlength="36" placeholder="例如：陳老師" required>
        </div>

        <div class="field">
          <label for="titleInput">教材標題</label>
          <input id="titleInput" name="title" type="text" maxlength="80" placeholder="例如：二次函數圖像探索" required>
        </div>

        <div class="field">
          <label for="topicInput">數學主題</label>
          <select id="topicInput" name="topic" required>
            <option value="代數">代數</option>
            <option value="幾何">幾何</option>
            <option value="函數">函數</option>
            <option value="統計與概率">統計與概率</option>
            <option value="微積分入門">微積分入門</option>
            <option value="綜合練習">綜合練習</option>
          </select>
        </div>

        <div class="field">
          <label for="descriptionInput">簡介</label>
          <textarea id="descriptionInput" name="description" maxlength="260" placeholder="簡短說明教材用途、適合年級或課堂活動方式。"></textarea>
        </div>

        <div class="field">
          <label for="fileInput">文檔或圖片</label>
          <div class="drop-zone">
            <input id="fileInput" name="file" type="file" accept="image/*,.pdf,.txt,.md,.doc,.docx,.ppt,.pptx" required>
            <p class="file-hint">支援圖片、PDF、文字檔、Word、PowerPoint。單檔上限 25MB。</p>
          </div>
        </div>

        <button id="uploadButton" type="submit">上傳並展示</button>
        <div id="formStatus" class="status" aria-live="polite"></div>
      </form>
    </section>

    <section class="gallery" aria-labelledby="galleryTitle">
      <div class="gallery-head">
        <h2 id="galleryTitle">即時教材展示牆</h2>
        <div id="materialCounter" class="counter">0 份教材</div>
      </div>
      <div id="emptyState" class="empty">尚未上傳教材。第一份教材上傳後會立即出現在這裡。</div>
      <div id="materials" class="materials" aria-live="polite"></div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      addDoc,
      collection,
      getFirestore,
      limit,
      onSnapshot,
      orderBy,
      query,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
    import {
      getDownloadURL,
      getStorage,
      ref,
      uploadBytes
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-storage.js";

    const firebaseConfig = {
      projectId: "teacherstudy-ac70b",
      appId: "1:1028149564309:web:25f04802c852cc9bed5c9c",
      storageBucket: "teacherstudy-ac70b.firebasestorage.app",
      apiKey: "AIzaSyB0HXQdfKtMH5t480kmAo3u-1emjCuiJvE",
      authDomain: "teacherstudy-ac70b.firebaseapp.com",
      messagingSenderId: "1028149564309"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    const uploadForm = document.getElementById("uploadForm");
    const uploadButton = document.getElementById("uploadButton");
    const formStatus = document.getElementById("formStatus");
    const liveText = document.getElementById("liveText");
    const materialsNode = document.getElementById("materials");
    const emptyState = document.getElementById("emptyState");
    const materialCounter = document.getElementById("materialCounter");

    const collectionName = "math_teaching_materials";
    const maxSize = 25 * 1024 * 1024;

    uploadForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = new FormData(uploadForm);
      const file = form.get("file");
      const author = cleanText(form.get("author"), 36);
      const title = cleanText(form.get("title"), 80);
      const topic = cleanText(form.get("topic"), 40);
      const description = cleanText(form.get("description"), 260);

      if (!file || !file.name) {
        setStatus("請選擇要上傳的文檔或圖片。", "error");
        return;
      }

      if (file.size > maxSize) {
        setStatus("檔案超過 25MB，請換一個較小的檔案。", "error");
        return;
      }

      uploadButton.disabled = true;
      uploadButton.textContent = "上傳中...";
      setStatus("正在上傳教材，完成後會自動出現在展示牆。", "");

      try {
        const textPreview = await buildTextPreview(file);
        const safeName = file.name.replace(/[^\w.\-\u4e00-\u9fff]/g, "_");
        const filePath = `math-teaching-showcase/${Date.now()}-${crypto.randomUUID()}-${safeName}`;
        const fileRef = ref(storage, filePath);
        await uploadBytes(fileRef, file, {
          contentType: file.type || "application/octet-stream",
          customMetadata: {
            author,
            title,
            topic
          }
        });
        const downloadUrl = await getDownloadURL(fileRef);

        await addDoc(collection(db, collectionName), {
          author,
          title,
          topic,
          description,
          fileName: file.name,
          filePath,
          fileSize: file.size,
          contentType: file.type || inferContentType(file.name),
          downloadUrl,
          textPreview,
          createdAt: serverTimestamp()
        });

        uploadForm.reset();
        setStatus("已上傳，展示牆已同步更新。", "success");
      } catch (error) {
        console.error(error);
        setStatus("上傳失敗，請確認 Firebase Storage 與 Firestore 規則已部署。", "error");
      } finally {
        uploadButton.disabled = false;
        uploadButton.textContent = "上傳並展示";
      }
    });

    const materialsQuery = query(
      collection(db, collectionName),
      orderBy("createdAt", "desc"),
      limit(40)
    );

    onSnapshot(materialsQuery, (snapshot) => {
      const items = snapshot.docs.map((doc) => ({
        id: doc.id,
        ...doc.data()
      }));
      renderMaterials(items);
      liveText.textContent = `已同步 ${items.length} 份`;
    }, (error) => {
      console.error(error);
      liveText.textContent = "同步失敗";
      setStatus("讀取教材失敗，請確認 Firestore 規則已部署。", "error");
    });

    function renderMaterials(items) {
      materialCounter.textContent = `${items.length} 份教材`;
      emptyState.classList.toggle("hidden", items.length > 0);
      materialsNode.innerHTML = items.map(renderMaterial).join("");
    }

    function renderMaterial(item) {
      const type = item.contentType || "";
      const description = item.description ? `<p class="description">${escapeHtml(item.description)}</p>` : "";
      const created = formatDate(item.createdAt);
      return `
        <article class="material">
          ${renderPreview(item, type)}
          <div class="material-body">
            <h3>${escapeHtml(item.title || item.fileName || "未命名教材")}</h3>
            <div class="meta">
              <span class="pill author">作者：${escapeHtml(item.author || "未標示")}</span>
              <span class="pill">${escapeHtml(item.topic || "數學")}</span>
              <span class="pill">${escapeHtml(fileLabel(type, item.fileName))}</span>
              <span class="pill">${created}</span>
            </div>
            ${description}
            <a class="open-link" href="${escapeAttribute(item.downloadUrl)}" target="_blank" rel="noopener">開啟原始檔案</a>
          </div>
        </article>
      `;
    }

    function renderPreview(item, type) {
      const url = escapeAttribute(item.downloadUrl || "");
      if (type.startsWith("image/")) {
        return `<div class="preview"><img src="${url}" alt="${escapeAttribute(item.title || item.fileName || "教材圖片")}"></div>`;
      }
      if (type === "application/pdf") {
        return `<div class="preview"><iframe title="${escapeAttribute(item.title || "PDF 教材")}" src="${url}"></iframe></div>`;
      }
      if (item.textPreview) {
        return `<div class="preview text"><pre class="text-preview">${escapeHtml(item.textPreview)}</pre></div>`;
      }
      const ext = extensionOf(item.fileName || type);
      return `<div class="preview"><div class="file-icon">${escapeHtml(ext || "DOC")}</div></div>`;
    }

    async function buildTextPreview(file) {
      const isText = file.type.startsWith("text/") || /\.(txt|md|csv)$/i.test(file.name);
      if (!isText) return "";
      const text = await file.text();
      return text.trim().slice(0, 900);
    }

    function inferContentType(name) {
      if (/\.pdf$/i.test(name)) return "application/pdf";
      if (/\.(png|jpg|jpeg|gif|webp)$/i.test(name)) return "image/*";
      if (/\.(txt|md|csv)$/i.test(name)) return "text/plain";
      return "application/octet-stream";
    }

    function fileLabel(type, name) {
      if (type.startsWith("image/")) return "圖片";
      if (type === "application/pdf") return "PDF";
      if (type.startsWith("text/")) return "文字";
      const ext = extensionOf(name || "");
      return ext ? ext : "文檔";
    }

    function extensionOf(name) {
      const match = String(name).match(/\.([a-z0-9]+)$/i);
      return match ? match[1].toUpperCase() : "";
    }

    function cleanText(value, limit) {
      return String(value || "").replace(/\s+/g, " ").trim().slice(0, limit);
    }

    function formatDate(value) {
      if (!value || !value.toDate) return "剛剛";
      return new Intl.DateTimeFormat("zh-Hant", {
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }).format(value.toDate());
    }

    function setStatus(text, type) {
      formStatus.textContent = text;
      formStatus.className = type ? `status ${type}` : "status";
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/`/g, "&#096;");
    }
  </script>
</body>
</html>
